name: WP Cron Keeper v2

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  trigger-wp-cron:
    runs-on: ubuntu-24.04
    steps:
      - name: Hit wp-cron.php
        run: curl -s -o /dev/null -w "wp-cron HTTP %{http_code}\n" "https://ib3news.tw/wp-cron.php?doing_wp_cron=1"

      - name: Keep workflow alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$f/enable"
